<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC27 Career Manager & Sofifa Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header span {
      color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .hero {
      margin-bottom: 2rem;
      text-align: center;
    }

    .hero h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 1.5rem auto 2.5rem;
      display: block;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .team-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .team-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .team-info h3 {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
    }

    .team-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .livedot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      background-color: var(--card-bg);
    }
  </style>
</head>
<body>

  <header>
    <h1>FC27 <span>Career Hub</span></h1>
  </header>

  <main>
    <div class="hero">
      <h2>Gestione Squadre e Database</h2>
      <p>Seleziona un club per consultare immediatamente le rose aggiornate in tempo reale.</p>
      
      <input type="text" id="searchInput" class="search-box" placeholder="Cerca squadra (es. Inter, Real Madrid, Lazio...)" onkeyup="filterTeams()">
    </div>

    <div class="teams-grid" id="teamsContainer">
      <!-- Le schede delle squadre verranno caricate qui dinamicamente -->
    </div>
  </main>

  <footer>
    <p>FC27 Web App &bull; Powered by Sofifa Data Integration</p>
  </footer>

  <script>
    const teams = [
      { name: "Inter", league: "Serie A", rating: "84" },
      { name: "Milan", league: "Serie A", rating: "82" },
      { name: "Juventus", league: "Serie A", rating: "83" },
      { name: "Lazio", league: "Serie A", rating: "80" },
      { name: "Napoli", league: "Serie A", rating: "81" },
      { name: "Roma", league: "Serie A", rating: "80" },
      { name: "Real Madrid", league: "La Liga", rating: "86" },
      { name: "Manchester City", league: "Premier League", rating: "87" },
      { name: "Bayern Monaco", league: "Bundesliga", rating: "85" }
    ];

    function renderTeams(list) {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Nessuna squadra trovata.</p>';
        return;
      }

      list.forEach(team => {
        const sofifaUrl = `https://sofifa.com/teams?keyword=${encodeURIComponent(team.name)}`;

        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
          <div class="team-info">
            <h3>${team.name}</h3>
            <p>${team.league} &bull; Rating: ${team.rating}</p>
          </div>
          <a href="${sofifaUrl}" target="_blank" class="btn" rel="noopener">
            <span class="livedot"></span> Rosa su Sofifa
          </a>
        `;
        container.appendChild(card);
      });
    }

    function filterTeams() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = teams.filter(t => t.name.toLowerCase().includes(query));
      renderTeams(filtered);
    }

    renderTeams(teams);
  </script>

</body>
</html>
