name: Prova voti EA
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Cerco la versione FC 27
        run: |
          for l in en en-us it-it fr; do
            curl -s -A "Mozilla/5.0" "https://drop-api.ea.com/rating/ea-sports-fc?locale=$l&limit=100&offset=0" -o r.json -w "$l HTTP %{http_code} "
            python3 -c "import json;d=json.load(open('r.json'));w=[p for p in d.get('items',[]) if p.get('lastName') in ('Wirtz','Isak','Kane')];print('TOTALE',d.get('totalItems'),[(p.get('lastName'),p.get('overallRating')) for p in w])" 2>/dev/null || echo "(nessun dato)"
          done
          curl -s -A "Mozilla/5.0" "https://www.ea.com/games/ea-sports-fc/ratings" -o pag.html
          grep -o 'src="[^"]*\.js[^"]*"' pag.html | sed 's/src="//;s/"$//' | sed 's#^/#https://www.ea.com/#' | sort -u > js.txt
          echo "== file js: $(wc -l < js.txt) =="
          while read u; do curl -s -A "Mozilla/5.0" "$u" >> tutto.js; echo >> tutto.js; done < js.txt
          echo "== punti dove si chiama drop-api =="
          grep -o '.\{160\}drop-api.\{200\}' tutto.js | head -8
          echo "== parole rating =="
          grep -o '.\{80\}rating/.\{120\}' tutto.js | head -8
