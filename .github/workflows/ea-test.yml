name: Prova voti EA
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Cerco il file dei giocatori di Recharge
        run: |
          pag="https://www.recharge.com/blog/en-gb/fc-27-player-ratings-database"
          curl -sL -A "Mozilla/5.0" "$pag" -o p.html
          echo "== 1: indirizzi nella pagina con fc / player / rating =="
          grep -oiE '(https?:)?//[^"'"'"' <>]*(fc-?2[67]|player|rating)[^"'"'"' <>]*' p.html | grep -viE '\.(png|jpe?g|webp|svg|css)' | sort -u | head -25
          echo "== 2: script della pagina =="
          grep -oE '<script[^>]*src="[^"]*"' p.html | grep -oE 'src="[^"]*"' | cut -d'"' -f2 | grep -iE 'fc|rating|player|data|db' | head -10 | tee s.txt
          while read u; do case "$u" in //*) u="https:$u";; /*) u="https://www.recharge.com$u";; esac
            curl -sL -A "Mozilla/5.0" "$u" -o s.js; echo "-- $u $(wc -c < s.js) byte"
            grep -oiE '.{0,60}(\.json|fetch\(|/api/)[^;]{0,120}' s.js | head -6; done < s.txt
          echo "== 3: data- attributi =="
          grep -oE 'data-[a-z-]*(src|url|json|endpoint)[a-z-]*="[^"]*"' p.html | sort -u | head -15
