name: Prova voti EA
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Cerco un database FC 27 aggiornato
        run: |
          for pag in "https://www.recharge.com/blog/en-gb/fc-27-player-ratings-database" "https://cmtracker.net/en/players"; do
            echo "===== $pag"
            curl -sL -A "Mozilla/5.0" "$pag" -o p.html -w "HTTP %{http_code} $(date +%s)\n"
            grep -oE 'https?://[^"'"'"' )]*\.(json|csv|gz)[^"'"'"' )]*' p.html | sort -u | head -10 > u.txt
            grep -oE '"/[^"]*\.(json|csv)[^"]*"' p.html | tr -d '"' | sort -u | head -10 >> u.txt
            grep -oE 'https?://[^"'"'"' ]*api[^"'"'"' ]*' p.html | sort -u | head -10 >> u.txt
            cat u.txt
            while read u; do case "$u" in /*) u="$(echo $pag | cut -d/ -f1-3)$u";; esac
              curl -sL -A "Mozilla/5.0" "$u" -o f.bin -w "  -> $u HTTP %{http_code} %{size_download} byte\n"
              head -c 200 f.bin | tr -d '\n'; echo; done < u.txt
          done
