name: Prova voti EA
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Cerco la versione FC 27
        run: |
          curl -s -A "Mozilla/5.0" "https://www.ea.com/games/ea-sports-fc/ratings" -o pag.html
          echo "== E: vicino a drop-api =="
          grep -o '.\{150\}drop-api.\{150\}' pag.html | head -4
          echo "== F: vicino a ea-sports-fc-27 =="
          grep -o '.\{200\}ea-sports-fc-27.\{200\}' pag.html | head -3
          echo "== G: prove =="
          for u in "rating/ea-sports-fc-27?locale=en&limit=100&offset=0" "rating/ea-sports-fc-27?locale=en" "rating/fc-27?locale=en&limit=100" "rating/ea-sports-fc?locale=en&limit=100&offset=0&gameSlug=fc-27"; do
            curl -s -A "Mozilla/5.0" "https://drop-api.ea.com/$u" -o r.json -w "$u HTTP %{http_code} "
            python3 -c "import json;d=json.load(open('r.json'));w=[p for p in d.get('items',[]) if p.get('lastName') in ('Wirtz','Isak','Kane')];print('TOTALE',d.get('totalItems'),[(p.get('lastName'),p.get('overallRating')) for p in w])" 2>/dev/null || echo "(nessun dato)"
          done
